name: Catalog validation and synchronization
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python hub.py validate
  sync:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python hub.py sync
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/catalog
          add-paths: catalog/manifest.json
          commit-message: 'chore: synchronize public releases'
          title: 'Update public mod catalog'
          body: 'Generated from allowlisted public GitHub Releases. Review compatibility before merging; compatibility is curated, never inferred from a new release.'
