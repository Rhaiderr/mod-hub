name: Catalog validation and synchronization
on:
  push:
  pull_request:
  schedule:
    - cron: '17 * * * *'  # hourly, on GitHub's runners
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python hub.py validate
  sync:
    # Publishes directly: releases are checked (owner, official URL, SemVer, SHA-256) and a changed
    # package under an already published version blocks the sync.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python hub.py sync
      - name: Commit catalog and deploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- web/catalog.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/catalog.json
          git commit -m 'chore: synchronize public releases'
          git push
          # Pushes made with GITHUB_TOKEN do not trigger workflows; dispatch the deploy explicitly.
          gh workflow run pages.yml --ref main
